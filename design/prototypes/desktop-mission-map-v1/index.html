<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WorkHub Goal Room V2 — Desktop Mission Room / Living Goal Map</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#08090b;--panel:#0e1013;--raised:#14171b;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--text:#f3f4f2;--soft:#c7c9ce;--muted:#898d96;--quiet:#5d626c;--owner:#efb45f;--ownerbg:rgba(239,180,95,.11);--agent:#66c9be;--agentbg:rgba(102,201,190,.1);--system:#8f9eff;--pass:#62d39d;--fail:#f0a15d}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}button{font:inherit}button:focus-visible{outline:2px solid #f4c77f;outline-offset:3px}.shell{min-height:100vh;display:grid;grid-template-rows:58px 1fr;background:radial-gradient(circle at 72% -15%,rgba(239,180,95,.055),transparent 38rem),var(--bg)}
.topbar{display:grid;grid-template-columns:280px 1fr auto;align-items:center;gap:24px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(8,9,11,.92);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:8px;background:var(--text);color:#0a0b0d;font-size:12px;font-weight:750}.brand strong{display:block;font-size:12px}.brand span{display:block;margin-top:1px;color:var(--quiet);font-size:9px;letter-spacing:.1em;text-transform:uppercase}.mode-switch{justify-self:center;display:flex;padding:4px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025)}.mode-switch button{min-height:36px;padding:0 15px;border:0;border-radius:7px;color:var(--muted);background:transparent;font-size:11px;cursor:pointer}.mode-switch button[aria-pressed=true]{color:var(--text);background:rgba(255,255,255,.075)}.connection{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px}.connection:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--agent);box-shadow:0 0 0 3px rgba(102,201,190,.09)}
.workspace{min-height:0;display:grid;grid-template-columns:280px minmax(520px,1fr) 340px}.rail{min-height:0;padding:20px 16px;border-right:1px solid var(--line);background:rgba(255,255,255,.012)}.eyebrow{color:var(--quiet);font-size:9px;font-weight:680;letter-spacing:.13em;text-transform:uppercase}.goal-name{margin:9px 0 0;font-size:20px;font-weight:610;line-height:1.15;letter-spacing:-.025em}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chip{display:inline-flex;min-height:25px;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(255,255,255,.018);font-size:9px;font-weight:600}.chip.owner{border-color:rgba(239,180,95,.22);color:#f4c985;background:var(--ownerbg)}.chip.agent{border-color:rgba(102,201,190,.2);color:#8edbd2;background:var(--agentbg)}.chip.fail{border-color:rgba(240,161,93,.23);color:#f4bc87;background:rgba(240,161,93,.1)}.chip.pass{border-color:rgba(98,211,157,.22);color:#8ce2b8;background:rgba(98,211,157,.1)}.state-list{display:grid;gap:6px;margin-top:25px}.state-list button{min-height:54px;padding:10px 11px;border:1px solid transparent;border-radius:10px;color:var(--muted);background:transparent;text-align:left;cursor:pointer}.state-list button[aria-pressed=true]{border-color:var(--line2);color:var(--text);background:rgba(255,255,255,.045)}.state-list strong{display:block;font-size:11px;font-weight:600}.state-list small{display:block;margin-top:4px;color:var(--quiet);font-size:9px}.rail-section{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}.rail-section h2{margin:0;color:var(--soft);font-size:11px;font-weight:620}.origin{display:grid;gap:12px;margin-top:13px;padding:0;list-style:none}.origin li{display:grid;grid-template-columns:8px 1fr;gap:9px;color:var(--muted);font-size:10px;line-height:1.4}.origin i{width:7px;height:7px;margin-top:3px;border-radius:50%;background:var(--quiet)}.origin li.active{color:var(--soft)}.origin li.active i{background:var(--owner);box-shadow:0 0 0 3px var(--ownerbg)}
.stage{min-width:0;min-height:0;padding:26px 30px 34px;overflow:auto}.stage-top{display:flex;align-items:center;justify-content:space-between;gap:16px}.stage-label{color:var(--quiet);font-size:9px;font-weight:680;letter-spacing:.13em;text-transform:uppercase}.state-code{color:var(--quiet);font:9px ui-monospace,SFMono-Regular,Menlo,monospace}.chapter{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:16px}.chapter div{height:3px;border-radius:3px;background:rgba(255,255,255,.07)}.chapter div.complete{background:rgba(102,201,190,.58)}.chapter div.active{background:var(--owner)}.chapter-labels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:6px;color:var(--quiet);font-size:8px}.chapter-labels span.active{color:var(--soft)}
.now{margin-top:24px;padding:30px;border:1px solid rgba(239,180,95,.22);border-radius:18px;background:linear-gradient(145deg,rgba(239,180,95,.09),rgba(255,255,255,.018) 58%);box-shadow:0 24px 70px rgba(0,0,0,.24)}.actor{display:inline-flex;min-height:26px;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;font-size:9px;font-weight:680;letter-spacing:.04em}.actor:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.actor.owner{color:#f4c985;background:var(--ownerbg)}.actor.agent{color:#8edbd2;background:var(--agentbg)}.now h1{max-width:720px;margin:19px 0 0;font-size:38px;font-weight:590;line-height:1.05;letter-spacing:-.04em;text-wrap:balance}.now>p{max-width:710px;margin:13px 0 0;color:var(--soft);font-size:15px;line-height:1.55}.authority{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;margin-top:23px;padding-top:19px;border-top:1px solid var(--line)}.authority-copy{display:flex;gap:10px;color:var(--muted);font-size:11px;line-height:1.45}.shield{color:var(--owner)}.actions{display:flex;gap:8px}.action{min-height:46px;padding:0 16px;border:1px solid var(--line2);border-radius:10px;color:var(--text);background:rgba(255,255,255,.035);font-size:11px;font-weight:620}.action.primary{border-color:#db9e4d;color:#201406;background:var(--owner)}.action.status{border-color:rgba(102,201,190,.2);color:#8edbd2;background:var(--agentbg)}
.lower{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:15px}.document,.mini{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.014)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.card-head h2{margin:0;font-size:11px;font-weight:620}.card-head span{color:var(--quiet);font-size:9px}.doc-row{padding:13px 16px;border-bottom:1px solid var(--line)}.doc-row:last-child{border:0}.doc-row dt{color:var(--quiet);font-size:8px;font-weight:680;letter-spacing:.1em;text-transform:uppercase}.doc-row dd{margin:5px 0 0;color:var(--soft);font-size:10px;line-height:1.45}.receipt-list{margin:0;padding:2px 16px 8px;list-style:none}.receipt-list li{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:9px;line-height:1.35}.receipt-list li:last-child{border:0}.receipt-list time{color:var(--quiet);font-family:ui-monospace,monospace}
.inspector{min-height:0;padding:21px 18px;border-left:1px solid var(--line);background:#0b0d10;overflow:auto}.inspector-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.018)}.inspector-tabs button{min-height:34px;border:0;border-radius:7px;color:var(--quiet);background:transparent;font-size:9px}.inspector-tabs button.active{color:var(--text);background:rgba(255,255,255,.07)}.inspector h2{margin:24px 0 0;font-size:17px;font-weight:600;letter-spacing:-.02em}.inspector>p{margin:8px 0 0;color:var(--muted);font-size:11px;line-height:1.5}.inspector-block{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.inspector-block strong{display:block;color:var(--quiet);font-size:8px;letter-spacing:.1em;text-transform:uppercase}.inspector-block p{margin:6px 0 0;color:var(--soft);font-size:10px;line-height:1.5}.checks{display:grid;gap:8px;margin:10px 0 0;padding:0;list-style:none}.checks li{display:grid;grid-template-columns:18px 1fr;gap:8px;color:var(--soft);font-size:10px;line-height:1.4}.check{display:grid;width:17px;height:17px;place-items:center;border-radius:50%;font-size:9px}.check.fail{color:#251508;background:var(--fail)}.check.pass{color:#071b12;background:var(--pass)}
/* materially different Living Goal Map */
.map-view{display:none}.shell[data-mode=map] .mission-view{display:none}.shell[data-mode=map] .map-view{display:block}.map-canvas{margin-top:24px;padding:24px;border:1px solid var(--line);border-radius:18px;background:radial-gradient(circle at 50% 40%,rgba(143,158,255,.045),transparent 30rem),rgba(255,255,255,.012)}.map-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.map-heading h1{max-width:650px;margin:7px 0 0;font-size:27px;font-weight:590;line-height:1.1;letter-spacing:-.03em}.map-spine{display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr 40px 1fr;align-items:stretch;margin-top:27px}.connector{position:relative}.connector:after{content:"";position:absolute;top:50%;right:6px;left:6px;height:1px;background:var(--line2)}.node{min-height:188px;padding:17px;border:1px solid var(--line);border-radius:13px;background:#101216}.node.active{border-color:rgba(239,180,95,.35);box-shadow:0 0 0 3px rgba(239,180,95,.055)}.node-type{color:var(--quiet);font-size:8px;font-weight:680;letter-spacing:.1em;text-transform:uppercase}.node h2{margin:12px 0 0;font-size:15px;font-weight:600;line-height:1.25}.node p{margin:8px 0 0;color:var(--muted);font-size:10px;line-height:1.45}.node-footer{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);color:var(--quiet);font:9px ui-monospace,monospace}.map-frontier{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;margin-top:14px;padding:16px 17px;border:1px solid rgba(239,180,95,.23);border-radius:13px;background:var(--ownerbg)}.map-frontier h2{margin:0;font-size:14px}.map-frontier p{margin:5px 0 0;color:var(--soft);font-size:10px}
@media(max-width:1100px){.workspace{grid-template-columns:240px minmax(480px,1fr)}.inspector{display:none}.topbar{grid-template-columns:240px 1fr auto}.map-spine{grid-template-columns:1fr 24px 1fr}.map-spine .node:nth-of-type(n+3),.map-spine .connector:nth-of-type(n+4){display:none}}
</style>
</head>
<body>
<div class="shell" data-mode="mission">
<header class="topbar"><div class="brand"><span class="mark">W</span><div><strong>Goal Room</strong><span>WorkHub</span></div></div><div class="mode-switch" aria-label="Desktop composition"><button data-mode="mission" aria-pressed="true">Mission Room</button><button data-mode="map" aria-pressed="false">Living Goal Map</button></div><span class="connection">WebMCP connected</span></header>
<div class="workspace">
<aside class="rail"><p class="eyebrow" id="goal-kicker"></p><h1 class="goal-name" id="goal-name"></h1><div class="chips" id="chips"></div><div class="state-list" aria-label="Prototype checkpoint picker"></div><section class="rail-section"><h2>Origin & decisions</h2><ol class="origin" id="origin"></ol></section></aside>
<main class="stage">
<div class="stage-top"><span class="stage-label" id="stage-label"></span><code class="state-code" id="state-code"></code></div><div class="chapter" id="chapter"></div><div class="chapter-labels" id="chapter-labels"></div>
<section class="mission-view"><article class="now"><span class="actor" id="actor"></span><h1 id="now-title"></h1><p id="now-body"></p><div class="authority"><div class="authority-copy"><span class="shield">◇</span><span id="boundary"></span></div><div class="actions" id="actions"></div></div></article><div class="lower"><section class="document"><div class="card-head"><h2 id="context-title"></h2><span id="context-version"></span></div><dl id="context-rows"></dl></section><section class="mini"><div class="card-head"><h2>Recent authority events</h2><span>immutable receipts</span></div><ol class="receipt-list" id="receipts"></ol></section></div></section>
<section class="map-view"><div class="map-canvas"><div class="map-heading"><div><span class="stage-label">Causal Goal map</span><h1 id="map-title"></h1></div><span class="actor" id="map-actor"></span></div><div class="map-spine" id="map-spine"></div><div class="map-frontier"><div><h2 id="map-frontier-title"></h2><p id="map-frontier-body"></p></div><div class="actions" id="map-actions"></div></div></div></section>
</main>
<aside class="inspector"><div class="inspector-tabs"><button class="active">Goal</button><button>Plan</button><button>Proof</button><button>Activity</button></div><h2 id="inspect-title"></h2><p id="inspect-summary"></p><div class="inspector-block"><strong>Exact binding</strong><p id="inspect-binding"></p></div><div class="inspector-block"><strong>Checks / conditions</strong><div id="inspect-checks"></div></div><div class="inspector-block"><strong>Why this frontier</strong><p id="inspect-why"></p></div></aside>
</div></div>
<script>
const stages=['Define','Plan','Work','Verify','Accept'];
const states={intent:{label:'Intent → proposal',note:'Goal not admitted',kicker:'Owner intent · draft',goal:'Ship a WebMCP entry that proves governed human–agent work',chips:[['Not yet a Goal','owner'],['Intent r1','']],stage:0,mapNode:0,actor:'agent',code:'S1 · INTENT_DRAFT',title:'Propose the Goal Contract',body:'Turn the owner’s intent into one falsifiable outcome with explicit proof, constraints, non-goals, and open questions.',boundary:'Planning and work remain blocked until the owner confirms an exact Goal Contract version.',actions:[['Agent preparing','status']],context:'Owner intent',version:'draft r1',rows:[['Intent','Build the clearest possible challenge entry without weakening owner authority.'],['Unresolved','What exact evidence counts as done? What remains outside agent authority?'],['Origin','Owner authored · two minutes ago']],receipts:[['18:02','Owner intent recorded'],['18:03','State exposed to browser agent']],origin:['Owner stated intent','Agent must propose Goal Contract'],inspect:['Intent is context—not admitted execution scope.','Intent r1 · no Goal digest','Goal Contract proposal required','No Plan can be proposed yet.']},goal:{label:'Goal → owner gate',note:'Plan blocked',kicker:'Goal Contract v1 · proposed',goal:'Publish a verified WebMCP Challenge entry',chips:[['Owner decision','owner'],['Goal v1',''],['Agent proposed','agent']],stage:0,mapNode:0,actor:'owner',code:'S2 · GOAL_PROPOSED',title:'Does this describe the right destination?',body:'The agent converted your intent into an immutable Goal Contract proposal. Confirm it or request an exact revision.',boundary:'Confirming admits planning—not execution, verification, publication, or final acceptance.',actions:[['Request changes',''],['Confirm Goal','primary']],context:'Goal Contract',version:'v1 · proposed',rows:[['Why','Prove WebMCP actions can remain state-aware, evidence-bound, and owner-controlled.'],['Done looks like','Public app works · governed refusal visible · exact evidence passes · owner accepts'],['Constraints','Under-three-minute demo · clean-room source · no external effects'],['Non-goals','Accounts, organizations, broad autonomy, production deployment']],receipts:[['18:02','Owner intent recorded'],['18:04','Agent proposed Goal v1'],['18:04','Owner frontier opened']],origin:['Owner stated intent','Agent proposed Goal v1','Owner decision required'],inspect:['Goal Contract v1 awaits owner authority.','Goal v1 · digest gc_9f31…b72a','Confirm or request immutable v2','Agent cannot confirm its own Goal.']},fail:{label:'Verification → correction',note:'Owner not required',kicker:'Confirmed Goal · v2',goal:'Publish a verified WebMCP Challenge entry',chips:[['Verification failed','fail'],['Candidate v1',''],['Goal v2','']],stage:3,mapNode:2,actor:'agent',code:'S8 · VERIFY_FAILED',title:'Correct Candidate v1',body:'Evidence is preserved, but two deterministic release checks failed. The agent must submit a new immutable candidate.',boundary:'FAIL reopens evidence. It does not change the confirmed Goal or ask the owner to accept incomplete work.',actions:[['View evidence',''],['Agent correcting','status']],context:'Proof',version:'Candidate v1',rows:[['Digest','4f7c6e21…9a03'],['Failed checks','Public URL must use HTTPS · demo exceeds 180 seconds'],['Next legal action','Agent submits Candidate v2 bound to Plan v2 and Goal v2']],receipts:[['18:20','Candidate v1 submitted'],['18:20','Verifier recorded FAIL'],['18:21','Correction frontier opened']],origin:['Goal v2 confirmed by owner','Plan v2 confirmed by owner','Candidate v1 failed verification'],inspect:['Candidate v1 failed exact release rules.','Goal v2 → Plan v2 → Candidate 4f7c…9a03','HTTPS URL · demo under 180 seconds','Internal verification—not owner judgment—opened correction.']},pass:{label:'Completion → owner gate',note:'PASS ≠ acceptance',kicker:'Confirmed Goal · v2',goal:'Publish a verified WebMCP Challenge entry',chips:[['Your approval','owner'],['PASS','pass'],['Candidate v2','']],stage:4,mapNode:3,actor:'owner',code:'S12 · COMPLETION_REQUESTED',title:'Accept the verified result?',body:'Candidate v2 passed the exact release checks. The agent requested completion, but only the owner can accept the Goal.',boundary:'Acceptance binds to this exact digest. Changed bytes require new evidence and verification.',actions:[['Request correction',''],['Accept result','primary']],context:'Verified result',version:'Candidate v2',rows:[['Digest','d803c87f…6b2a'],['Passed checks','HTTPS public URL · demo under 180 seconds · npm test verification'],['Agent request','Completion requested for this exact passing candidate']],receipts:[['18:31','Candidate v2 submitted'],['18:31','Verifier recorded PASS'],['18:32','Agent requested completion']],origin:['Goal v2 confirmed by owner','Plan v2 confirmed by owner','Candidate v2 passed','Owner acceptance required'],inspect:['A verified candidate awaits owner acceptance.','Goal v2 → Plan v2 → Candidate d803…6b2a','All exact release checks PASS','PASS permits a completion request; it does not finish the Goal.']}};
let active='intent';const $=id=>document.getElementById(id);
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function actionNodes(actions){return actions.map(([label,type])=>{const x=el(type==='status'?'div':'button',`action ${type||''}`,label);if(type==='status')x.setAttribute('role','status');else{x.type='button';x.onclick=()=>{}}return x})}
function render(){const s=states[active];$('goal-kicker').textContent=s.kicker;$('goal-name').textContent=s.goal;$('chips').replaceChildren(...s.chips.map(([t,c])=>el('span',`chip ${c}`,t)));$('stage-label').textContent=stages[s.stage]+' chapter';$('state-code').textContent=s.code;$('chapter').replaceChildren(...stages.map((_,i)=>el('div',i<s.stage?'complete':i===s.stage?'active':'')));$('chapter-labels').replaceChildren(...stages.map((x,i)=>el('span',i===s.stage?'active':'',x)));$('actor').textContent=s.actor.toUpperCase()+' acts now';$('actor').className=`actor ${s.actor}`;$('now-title').textContent=s.title;$('now-body').textContent=s.body;$('boundary').textContent=s.boundary;$('actions').replaceChildren(...actionNodes(s.actions));$('context-title').textContent=s.context;$('context-version').textContent=s.version;$('context-rows').replaceChildren(...s.rows.map(([a,b])=>{const w=el('div','doc-row'),dt=el('dt','',a),dd=el('dd','',b);w.append(dt,dd);return w}));$('receipts').replaceChildren(...s.receipts.map(([a,b])=>{const li=el('li');li.append(el('time','',a),el('span','',b));return li}));$('origin').replaceChildren(...s.origin.map((x,i)=>{const li=el('li',i===s.origin.length-1?'active':'');li.append(el('i'),el('span','',x));return li}));$('inspect-title').textContent=s.inspect[0];$('inspect-summary').textContent=s.title;$('inspect-binding').textContent=s.inspect[1];$('inspect-why').textContent=s.inspect[3];const checks=s.inspect[2].split(' · ');$('inspect-checks').replaceChildren(el('ul','checks'));const ul=$('inspect-checks').firstChild;for(const c of checks){const li=el('li');li.append(el('span',`check ${active==='fail'?'fail':'pass'}`,active==='fail'?'!':'✓'),el('span','',c));ul.append(li)}$('map-title').textContent=s.goal;$('map-actor').textContent=s.actor.toUpperCase()+' acts now';$('map-actor').className=`actor ${s.actor}`;const goalRef=active==='intent'?'intent_r1':active==='goal'?'goal_v1':'goal_v2',planRef=active==='intent'||active==='goal'?'—':'plan_v2',candidateRef=active==='fail'?'4f7c…9a03':active==='pass'?'d803…6b2a':'—';const nodes=[['Goal Contract',active==='intent'?'Not admitted':active==='goal'?'v1 · proposed':'v2 · confirmed',goalRef],['Plan',active==='intent'||active==='goal'?'Blocked':'v2 · confirmed',planRef],['Candidate',active==='fail'?'v1 · failed':active==='pass'?'v2 · passed':'Not admitted',candidateRef],['Acceptance',active==='pass'?'Owner required':'Not legal','owner only']];$('map-spine').replaceChildren(...nodes.flatMap(([a,b,ref],i)=>{const n=el('article',`node ${i===s.mapNode?'active':''}`);n.append(el('span','node-type',a),el('h2','',b),el('p','',i===0?s.context:i===1?'Execution agreement bound to Goal':i===2?'Exact candidate and verifier custody':'Terminal owner decision'),el('div','node-footer',ref));return i<nodes.length-1?[n,el('div','connector')]:[n]}));$('map-frontier-title').textContent=s.title;$('map-frontier-body').textContent=s.boundary;$('map-actions').replaceChildren(...actionNodes(s.actions));document.querySelectorAll('.state-list button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===active)))}
const list=document.querySelector('.state-list');for(const [key,s] of Object.entries(states)){const b=el('button');b.type='button';b.dataset.state=key;b.append(el('strong','',s.label),el('small','',s.note));b.onclick=()=>{active=key;render()};list.append(b)}document.querySelectorAll('.mode-switch button').forEach(b=>b.onclick=()=>{document.querySelector('.shell').dataset.mode=b.dataset.mode;document.querySelectorAll('.mode-switch button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))) });render();
</script>
</body></html>
