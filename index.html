<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WorkHub Goal Room — one governed Goal, one truthful frontier, and final owner acceptance." />
    <title>WorkHub Goal Room — Mission Room</title>
  </head>
  <body>
    <main id="mobile-room" class="mobile-room" aria-label="WorkHub Goal Room mobile"></main>
    <div class="desktop-surface">
      <main id="desktop-room" class="desktop-room" aria-label="WorkHub Goal Room desktop Mission Room"></main>
    </div>

    <dialog id="revision-dialog" class="revision-dialog" aria-labelledby="revision-dialog-title">
      <form id="revision-form" method="dialog">
        <div>
          <p class="label">REQUEST REVISION</p>
          <h2 id="revision-dialog-title">What should change?</h2>
          <p id="revision-dialog-copy"></p>
        </div>
        <label for="revision-input">Revision note</label>
        <textarea id="revision-input" name="revision-note" rows="5" required minlength="3" maxlength="500" placeholder="For example: separate final verification and add the three-minute demo limit."></textarea>
        <div class="dialog-actions">
          <button id="cancel-revision" class="button secondary" type="button">Cancel</button>
          <button class="button primary" type="submit">Send revision request</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
