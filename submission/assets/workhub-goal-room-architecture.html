<title id="title">WorkHub Goal Room V3 authority architecture</title>
<desc id="desc">Owner UI and exactly six Agent WebMCP tools enter one authority kernel. The production System adapter applies deterministic rules to exact candidate bytes. PASS enables an Agent completion request but never flows directly to Owner acceptance.</desc>

 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#172033" stroke-width="1"/></pattern>

 <style>

 </style>
