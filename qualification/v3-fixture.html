<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Goal Room V3 Qualification Fixture</title>
    <style>
      .qualification-transient {
        margin: 0;
        padding: 10px 14px;
        border-bottom: 1px solid #a9b0e8;
        color: #d9dcf5;
        background: #151822;
        font: 700 12px/1.4 Arial, sans-serif;
        letter-spacing: .04em;
      }
    </style>
  </head>
  <body>
    <main id="mobile-room" class="mobile-room" aria-label="WorkHub Goal Room mobile"></main>
    <div class="desktop-surface">
      <main id="desktop-room" class="desktop-room" aria-label="WorkHub Goal Room desktop Mission Room"></main>
    </div>
    <dialog id="acceptance-dialog" class="acceptance-dialog" aria-labelledby="acceptance-dialog-title" aria-describedby="acceptance-dialog-consequence">
      <form id="acceptance-form" method="dialog">
        <p class="dialog-label">OWNER CONFIRMATION · QUALIFICATION</p>
        <h2 id="acceptance-dialog-title">Accept this candidate?</h2>
        <p id="acceptance-dialog-consequence"></p>
        <dl class="acceptance-binding">
          <div><dt>Candidate</dt><dd id="acceptance-candidate-version"></dd></div>
          <div><dt>SHA-256</dt><dd><code id="acceptance-candidate-digest"></code></dd></div>
          <div><dt>PASS rule set</dt><dd><code id="acceptance-rule-set"></code></dd></div>
        </dl>
        <div class="dialog-actions">
          <button id="cancel-acceptance" class="button secondary" type="button">Cancel</button>
          <button id="confirm-acceptance" class="button primary" type="submit">Confirm acceptance</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/qualification/v3-fixture.ts"></script>
  </body>
</html>
